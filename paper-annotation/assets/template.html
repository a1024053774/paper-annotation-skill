<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #14233c; --navy-2: #1e3353; --paper: #f7f3ea; --zh-bg: #f0ece2; --ink: #22252b;
  --muted: #6b6f78; --line: #dcd5c5; --card: #fbf9f4;
  --thesis: #fbe38a; --concept: #f7c4bd; --evidence: #c3daf6; --concession: #c9e6c4; --method: #dccbf1;
  --thesis-d: #b78a00; --concept-d: #b8433a; --evidence-d: #2f6bb3; --concession-d: #3f8a3a; --method-d: #7448b0;
  --serif: "Lora", Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  --sans: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 56px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
header { background: var(--navy); color: #f3efe4; padding: 28px 24px 20px; }
header .in, main, .bar .in { max-width: 1240px; margin: 0 auto; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.sub { margin: 0 0 16px; color: #c3cbd9; font-size: .92rem; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip, .toggle { font: 500 .8rem var(--sans); border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="false"] { background: transparent !important; color: #c3cbd9; box-shadow: inset 0 0 0 1px #5b6b86; text-decoration: line-through; }
.toggle { background: transparent; color: #f3efe4; box-shadow: inset 0 0 0 1px #7384a0; margin-left: 4px; }
.toggle[aria-pressed="false"] { color: #9aa6ba; text-decoration: line-through; }
.k-thesis { background: var(--thesis); } .k-concept { background: var(--concept); }
.k-evidence { background: var(--evidence); } .k-concession { background: var(--concession); }
.k-method { background: var(--method); }
.bar { position: sticky; top: 0; z-index: 5; background: var(--navy-2); padding: 0 24px; }
.bar .in { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.bar a { color: #c3cbd9; text-decoration: none; font-size: .84rem; padding: 11px 12px; white-space: nowrap; border-bottom: 2px solid transparent; }
.bar a:hover, .bar a.on { color: #fff; border-bottom-color: var(--thesis); }
main { padding: 8px 24px 80px; }
h2 { font-family: var(--serif); font-size: 1.3rem; margin: 44px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--navy); }
.zh-title { font-family: var(--sans); font-size: .95rem; font-weight: 400; color: var(--muted); margin-left: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.text { position: relative; padding-left: 38px; min-width: 0; }
.num { position: absolute; left: 0; top: 4px; font-size: .72rem; color: var(--muted); text-decoration: none; }
.row:target { background: #fff8dc; outline: 8px solid #fff8dc; }
.en { font-family: var(--serif); font-size: 1.05rem; line-height: 1.75; margin: 0; }
.en.quote { margin-left: 18px; padding-left: 14px; border-left: 3px solid var(--line); font-style: italic; }
pre.en { white-space: pre-wrap; overflow-x: auto; font-size: .98rem; text-align: center; }
mark { color: inherit; padding: 1px 2px; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.zh { margin: 12px 0 0; padding: 10px 14px; background: var(--zh-bg); border-left: 2px solid #b9ae95; border-top: 1px solid var(--line); font-size: .95rem; line-height: 1.85; }
.figure .label { font: 600 .78rem var(--sans); letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.figure .en { font-size: .96rem; }
.figure img { display: block; max-width: 100%; height: auto; margin: 8px 0 12px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
.note { align-self: start; background: var(--card); border-left: 4px solid #b9ae95; border-radius: 0 6px 6px 0; padding: 10px 14px; font-size: .88rem; line-height: 1.7; }
.note.empty { visibility: hidden; }
.note p { margin: 6px 0 0; }
.note b { display: inline-block; font-weight: 600; font-size: .76rem; color: var(--muted); margin-right: 8px; }
.note .doubt b { color: var(--concept-d); }
.fn { display: inline-block; font-weight: 600; font-size: .78rem; background: var(--navy); color: #fff; border-radius: 4px; padding: 1px 8px; }
.n-thesis { border-left-color: var(--thesis-d); } .n-concept { border-left-color: var(--concept-d); }
.n-evidence { border-left-color: var(--evidence-d); } .n-concession { border-left-color: var(--concession-d); }
.n-method { border-left-color: var(--method-d); }
#overview { margin-top: 56px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 28px 28px; }
#overview h2 { margin-top: 20px; }
#overview h3 { font-size: 1rem; margin: 28px 0 8px; }
.skeleton { list-style: none; margin: 0; padding: 0; }
.skeleton li { display: grid; grid-template-columns: 5.5em 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.skeleton b { color: var(--navy); }
.claim { margin: 22px 0; padding: 14px 18px; background: var(--thesis); border-radius: 6px; font-size: 1.02rem; }
.claim b { display: block; font-size: .78rem; margin-bottom: 4px; }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.verdict > div { padding: 12px 16px; border-radius: 6px; border-left: 4px solid; background: #fff; }
.verdict p { margin: 4px 0 0; }
.strongest { border-color: var(--concession-d); } .weakest { border-color: var(--concept-d); }
.ref { font-size: .78rem; color: var(--evidence-d); text-decoration: none; white-space: nowrap; }
.ref:hover { text-decoration: underline; }
.glossary { border-collapse: collapse; width: 100%; font-size: .9rem; }
.glossary td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.glossary td:first-child { font-family: var(--serif); white-space: nowrap; }
.coverage { margin: 24px 0 0; font-size: .8rem; color: var(--muted); }
body.off-thesis mark.k-thesis, body.off-concept mark.k-concept, body.off-evidence mark.k-evidence,
body.off-concession mark.k-concession, body.off-method mark.k-method { background: transparent; }
body.hide-zh .text .zh { display: none; }
body.hide-notes .note { display: none; }
body.hide-notes .row { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
@media (max-width: 860px) {
  header { padding: 22px 16px 16px; } .bar { padding: 0 8px; } main { padding: 4px 16px 60px; }
  h1 { font-size: 1.35rem; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .text { padding-left: 0; } .num { position: static; display: block; margin-bottom: 2px; }
  .note.empty { display: none; }
  .verdict { grid-template-columns: 1fr; } #overview { padding: 4px 16px 20px; }
  .skeleton li { grid-template-columns: 1fr; gap: 2px; }
}
@media print {
  .bar, .tools { display: none; } header { background: none; color: var(--ink); padding: 0 0 12px; }
  .sub { color: var(--muted); } body { background: #fff; } .row { break-inside: avoid; }
  mark { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<header><div class="in">
  {{HEADER}}
  <div class="tools">{{LEGEND}}
    <button class="toggle" data-hide="hide-zh" aria-pressed="true">中文译文</button>
    <button class="toggle" data-hide="hide-notes" aria-pressed="true">批注</button>
  </div>
</div></header>
<nav class="bar"><div class="in">{{NAV}}</div></nav>
<main>
{{BODY}}
<section id="overview"><h2>论证结构总览</h2>{{OVERVIEW}}</section>
</main>
<script>
document.querySelectorAll(".tools button").forEach(function (button) {
  button.addEventListener("click", function () {
    var on = button.getAttribute("aria-pressed") !== "true";
    button.setAttribute("aria-pressed", on);
    document.body.classList.toggle(button.dataset.hide || "off-" + button.dataset.kind, !on);
  });
});
if ("IntersectionObserver" in window) {
  var links = {};
  document.querySelectorAll(".bar a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  var spy = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      Object.keys(links).forEach(function (id) { links[id].classList.toggle("on", id === entry.target.id); });    });
  }, { rootMargin: "-56px 0px -75% 0px" });
  document.querySelectorAll("main > section").forEach(function (section) { spy.observe(section); });
}
</script>
</body>
</html>
